name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Windows .NET Framework
        shell: powershell
        run: .\Build.ps1
      - name: Safety-policy tests
        shell: powershell
        run: .\Test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ExplorerMerge
          path: dist/ExplorerMerge.exe
